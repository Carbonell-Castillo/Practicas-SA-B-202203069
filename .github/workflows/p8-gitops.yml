name: P8 CI · Supply chain · GitOps PR

on:
  pull_request:
    branches: [main]
    paths:
      - "P5/apps/**"
      - "P8/**"
      - ".github/workflows/p8-gitops.yml"
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica ya publicada como tag (ej. 1.2.3)"
        required: false
        type: string
      induce_failure:
        description: "Crear gateway defectuoso para demostrar el rollback canary"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: p8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Versión semántica
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.semver.outputs.value }}
      publish: ${{ steps.semver.outputs.publish }}
    steps:
      - id: semver
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            value="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ -n "${MANUAL_VERSION:-}" ]]; then
            value="$MANUAL_VERSION"
            publish=true
          else
            value="0.0.0-pr.${{ github.event.pull_request.number || github.run_number }}"
            publish=false
          fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  quality:
    name: Calidad, Terraform y Helm
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Validar Terraform
        working-directory: P8/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: helm lint de todos los microservicios
        shell: bash
        run: |
          for chart in P8/gitops-repository/charts/*; do
            helm lint "$chart" -f "$chart/values-dev.yaml"
            helm lint "$chart" -f "$chart/values-prod.yaml"
            helm template test "$chart" -f "$chart/values-prod.yaml" >/dev/null
          done
      - name: Validar scripts
        run: |
          bash -n P8/tests/smoke.sh
          bash -n P8/tests/integration.sh

  unit-tests:
    name: Pruebas · ${{ matrix.service }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, authorization-service, products-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.service != 'products-service'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: P5/apps/${{ matrix.service }}/package-lock.json
      - uses: actions/setup-python@v5
        if: matrix.service == 'products-service'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: P5/apps/products-service/requirements.txt
      - run: bash P7/scripts/test-service.sh "${{ matrix.service }}"

  publish:
    name: Escanear, publicar, SBOM y firmar · ${{ matrix.service }}
    needs: [version, quality, unit-tests]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - authorization-service
          - products-service
          - orders-service
          - notifications-service
          - gateway
          - frontend
          - cron-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: P5/apps/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ needs.version.outputs.value }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_GATEWAY_URL=/
            P8_INDUCED_FAILURE=${{ inputs.induce_failure || false }}
          cache-from: type=gha,scope=p8-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=p8-${{ matrix.service }}
      - name: Trivy bloquea CVE críticas
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ needs.version.outputs.value }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generar SBOM SPDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Firma keyless de la imagen inmutable
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ matrix.service }}-${{ needs.version.outputs.value }}
          path: |
            trivy-${{ matrix.service }}.sarif
            sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn

  gitops-pr:
    name: Pull Request hacia la fuente de verdad
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Carbonell-Castillo/Practicas-SA-B-202203069-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Actualizar únicamente tags declarativos
        working-directory: gitops
        env:
          VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          for values in charts/*/values-prod.yaml; do
            sed -i -E 's/^  tag: .*/  tag: "'"$VERSION"'"/' "$values"
          done
      - name: Crear Pull Request auditable
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          branch: release/${{ needs.version.outputs.value }}
          delete-branch: true
          commit-message: "chore(release): ${{ needs.version.outputs.value }}"
          title: "chore(release): promover ${{ needs.version.outputs.value }}"
          body: |
            Imágenes escaneadas con Trivy, acompañadas de SBOM y firmadas con Cosign keyless.
            ArgoCD reconciliará el cambio únicamente después de aprobar y fusionar este PR.
          labels: release,gitops
