services:
  postgres:
    container_name: solicitudes-postgres
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - solicitudes_postgres_data:/var/lib/postgresql/data
    networks:
      - solicitudes-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  solicitudes-network:
    driver: bridge

volumes:
  solicitudes_postgres_data:
    name: solicitudes_postgres_data
