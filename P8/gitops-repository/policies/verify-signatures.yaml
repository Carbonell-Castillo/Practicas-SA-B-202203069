apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-ghcr-signatures
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-cosign-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sa-p8-prod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/carbonell-castillo/auth-service:*"
            - "ghcr.io/carbonell-castillo/authorization-service:*"
            - "ghcr.io/carbonell-castillo/products-service:*"
            - "ghcr.io/carbonell-castillo/orders-service:*"
            - "ghcr.io/carbonell-castillo/notifications-service:*"
            - "ghcr.io/carbonell-castillo/gateway:*"
            - "ghcr.io/carbonell-castillo/frontend:*"
          required: true
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    subjectRegExp: "https://github.com/Carbonell-Castillo/Practicas-SA-B-202203069/.*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
