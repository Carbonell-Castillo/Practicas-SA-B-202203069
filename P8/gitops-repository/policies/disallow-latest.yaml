apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Prohibir latest
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sa-p8-prod]
      validate:
        message: Las imágenes no pueden utilizar la etiqueta latest.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true
