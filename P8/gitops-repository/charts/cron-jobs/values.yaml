image:
  repository: ghcr.io/carbonell-castillo/cron-jobs
  tag: "1.0.0"

secretName: cron-runtime

heartbeat:
  schedule: "*/2 * * * *"
summary:
  schedule: "*/10 * * * *"

env:
  LOG_LEVEL: log
  STUDENT_CARNET: "202203069"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
