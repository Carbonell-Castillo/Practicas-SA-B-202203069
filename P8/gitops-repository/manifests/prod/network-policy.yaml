apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sa-p8-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform
  namespace: sa-p8-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sa-platform
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sa-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
  policyTypes: [Ingress]
