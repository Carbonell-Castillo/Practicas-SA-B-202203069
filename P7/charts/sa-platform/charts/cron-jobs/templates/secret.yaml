apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels:
    {{- include "sa-common.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ required "cron-jobs: secret.DATABASE_URL es obligatorio (ver values.example.yaml)" .Values.secret.DATABASE_URL | b64enc | quote }}
  RABBITMQ_URL: {{ required "cron-jobs: secret.RABBITMQ_URL es obligatorio (ver values.example.yaml)" .Values.secret.RABBITMQ_URL | b64enc | quote }}
