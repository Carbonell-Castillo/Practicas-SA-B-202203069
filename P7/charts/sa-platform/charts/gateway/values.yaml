componentLabel: gateway

replicaCount: 2

image:
  repository: sa-platform/gateway
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8080
  targetPort: 8080

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

probes:
  # /health hace fan-out a los 4 microservicios (axios timeout 3000ms cada
  # uno, en paralelo vía Promise.all) — con NetworkPolicy real de por medio
  # el peor caso ronda esos 3s, así que timeoutSeconds necesita margen sobre
  # eso (el default de Kubernetes es 1s, insuficiente: causaba
  # "context deadline exceeded" y reinicios en bucle del pod).
  startup:
    path: /health
    periodSeconds: 3
    timeoutSeconds: 5
    failureThreshold: 10
  liveness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

config:
  PORT: "8080"
  FRONTEND_URL: "http://frontend:3000"
  AUTH_SERVICE_URL: "http://auth-service:4000"
  AUTHORIZATION_SERVICE_URL: "http://authorization-service:4001"
  PRODUCTS_SERVICE_URL: "http://products-service:4002"
  ORDERS_SERVICE_URL: "http://orders-service:4003"
  LOG_LEVEL: "info"

secret: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
