componentLabel: auth-service

replicaCount: 2

image:
  repository: sa-platform/auth-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 4000
  targetPort: 4000

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Justificación de los probes: el arranque ejecuta "prisma migrate deploy" antes de levantar
# Nest, lo que puede tardar varios segundos en frío -> startupProbe con margen amplio
# (30 x 5s = 150s) evita que liveness mate el pod durante la migración. Una vez arriba,
# /api/health no depende de la DB, así que liveness/readiness pueden ser agresivos (10s).
probes:
  startup:
    path: /api/health
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

config:
  PORT: "4000"
  FRONTEND_URL: "http://frontend:3000"
  AUTHORIZATION_SERVICE_URL: "http://authorization-service:4001/api"
  AUTHORIZATION_TIMEOUT_MS: "2000"
  AUTHORIZATION_MAX_RETRIES: "3"
  AUTHORIZATION_BACKOFF_MS: "500"
  JWT_EXPIRES_IN_SECONDS: "300"
  JWT_RENEWAL_GRACE_SECONDS: "600"
  JWT_COOKIE_NAME: "access_token"
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: "lax"
  LOG_LEVEL: "log"

secret:
  DATABASE_URL: ""
  JWT_SECRET: ""
  AES_KEY: ""

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
