componentLabel: authorization-service

replicaCount: 2

image:
  repository: sa-platform/authorization-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 4001
  targetPort: 4001

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Servicio sin estado ni dependencias externas -> arranca casi de inmediato, probes ajustados.
probes:
  startup:
    path: /api/health
    periodSeconds: 3
    failureThreshold: 10
  liveness:
    path: /api/health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

config:
  PORT: "4001"
  LOG_LEVEL: "log"

secret: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
