apiVersion: v2
name: sa-platform
description: >-
  Plataforma de microservicios para el CD efímero de la Práctica 7 sobre
  Kubernetes Kind: auth, authorization, products, orders, notifications,
  API Gateway y frontend, con Postgres y RabbitMQ.
type: application
version: 0.2.0
appVersion: "1.0.0"
home: https://github.com/Carbonell-Castillo
keywords:
  - microservices
  - kubernetes
  - nestjs
  - fastapi
  - nextjs
dependencies:
  # --- Infraestructura (Bitnami), sección A de Make.md ---
  - name: postgresql
    version: "16.7.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  # rabbitmq: NO se usa bitnami/rabbitmq — sus imágenes de contenedor dejaron
  # de estar disponibles gratis en Docker Hub (repo bitnami/rabbitmq pasó a
  # "commercial subscription only", confirmado vía Docker Hub API: 0 tags
  # públicos). El CHART bitnami sí resolvía bien; solo el pull de imagen del
  # pod fallaba (ErrImagePull). Se reemplaza por un chart propio (mismo
  # mecanismo: "dependencia declarada en Chart.yaml, resuelta con helm
  # dependency update", solo que vía repositorio LOCAL en vez de remoto) que
  # usa la imagen oficial rabbitmq:4-management-alpine. Ver charts/rabbitmq/.
  - name: rabbitmq
    version: "0.1.0"
    repository: "file://charts/rabbitmq"
    condition: rabbitmq.enabled

  # --- Librería de named templates compartidos ---
  - name: sa-common
    version: "0.1.0"
    repository: "file://charts/sa-common"

  # --- Subcharts de la plataforma (4 microservicios + gateway + frontend +
  #     notifications-service + cron-jobs) ---
  - name: auth-service
    version: "0.1.0"
    repository: "file://charts/auth-service"
    alias: authService
    condition: authService.enabled
  - name: authorization-service
    version: "0.1.0"
    repository: "file://charts/authorization-service"
    alias: authorizationService
    condition: authorizationService.enabled
  - name: products-service
    version: "0.1.0"
    repository: "file://charts/products-service"
    alias: productsService
    condition: productsService.enabled
  - name: orders-service
    version: "0.1.0"
    repository: "file://charts/orders-service"
    alias: ordersService
    condition: ordersService.enabled
  - name: notifications-service
    version: "0.1.0"
    repository: "file://charts/notifications-service"
    alias: notificationsService
    condition: notificationsService.enabled
  - name: gateway
    version: "0.1.0"
    repository: "file://charts/gateway"
    condition: gateway.enabled
  - name: frontend
    version: "0.1.0"
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: cron-jobs
    version: "0.1.0"
    repository: "file://charts/cron-jobs"
    alias: cronJobs
    condition: cronJobs.enabled
