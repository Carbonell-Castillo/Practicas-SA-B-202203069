{{/*
Único punto de entrada al clúster (sección E de Make.md): el Ingress enruta
por path hacia el Gateway (API + GraphQL + health/docs) y hacia el frontend
(todo lo demás). Ni los microservicios, ni Postgres, ni RabbitMQ tienen
Ingress/NodePort/LoadBalancer propio — solo ClusterIP (ver cada
templates/service.yaml de los subcharts).
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sa-platform-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.fullnameOverride | default "gateway" }}
                port:
                  number: 8080
          - path: /products/graphql
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.fullnameOverride | default "gateway" }}
                port:
                  number: 8080
          - path: /orders/graphql
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.fullnameOverride | default "gateway" }}
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.fullnameOverride | default "gateway" }}
                port:
                  number: 8080
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.gateway.fullnameOverride | default "gateway" }}
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.fullnameOverride | default "frontend" }}
                port:
                  number: 3000
{{- end }}
