apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels:
    {{- include "sa-common.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ required "auth-service: secret.DATABASE_URL es obligatorio (ver values.example.yaml)" .Values.secret.DATABASE_URL | b64enc | quote }}
  JWT_SECRET: {{ required "auth-service: secret.JWT_SECRET es obligatorio (ver values.example.yaml)" .Values.secret.JWT_SECRET | b64enc | quote }}
  AES_KEY: {{ required "auth-service: secret.AES_KEY es obligatorio (ver values.example.yaml)" .Values.secret.AES_KEY | b64enc | quote }}
