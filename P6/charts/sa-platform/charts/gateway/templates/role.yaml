{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels:
    {{- include "sa-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "sa-common.fullname" . | quote }}]
    verbs: ["get"]
  {{- if .Values.secret.enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "sa-common.fullname" . | quote }}]
    verbs: ["get"]
  {{- end }}
{{- end }}
