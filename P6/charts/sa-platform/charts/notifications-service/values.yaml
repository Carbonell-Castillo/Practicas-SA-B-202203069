componentLabel: notifications-service

replicaCount: 2

image:
  repository: sa-platform/notifications-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 4004
  targetPort: 4004

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

probes:
  startup:
    path: /api/health
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# min=2 replicas cada uno con su propia conexion AMQP: RabbitMQ reparte los mensajes de cada
# cola entre los consumidores conectados (round-robin), asi que escalar este Deployment
# tambien paraleliza el drenado de la cola sin duplicar procesamiento (ack manual + prefetch=1).
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

config:
  PORT: "4004"
  LOG_LEVEL: "log"

secret:
  DATABASE_URL: ""
  RABBITMQ_URL: ""

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
